function chime(){ctx();const t=A.currentTime;[660,990].forEach((f,i)=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.setValueAtTime(.001,t+i*.12);g.gain.exponentialRampToValueAtTime(.12,t+i*.12+.03);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.9);o.connect(g);g.connect(mg);o.start(t+i*.12);o.stop(t+i*.12+1)})}
